<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>大模型技术创新赛 · 任务指挥面板</title>
<script src="roslib.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b0f16; color: #dbe4f0; font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 10px 20px;
    background: #111827; border-bottom: 1px solid #1f2b3d;
  }
  header h1 { font-size: 20px; color: #f8fafc; font-weight: 600; }
  #conn {
    padding: 3px 12px; border-radius: 12px; font-size: 13px;
    background: #7f1d1d; color: #fecaca;
  }
  #conn.ok { background: #14532d; color: #bbf7d0; }
  #simtime { margin-left: auto; font-size: 13px; color: #64748b; }
  main {
    flex: 1; display: grid; grid-template-columns: 330px 1fr 300px;
    gap: 12px; padding: 12px; min-height: 0;
  }
  .panel {
    background: #111827; border: 1px solid #1f2b3d; border-radius: 10px;
    padding: 12px; display: flex; flex-direction: column; min-height: 0;
  }
  .panel h2 {
    font-size: 14px; color: #7dd3fc; margin-bottom: 8px; font-weight: 600;
    letter-spacing: 1px;
  }
  #question {
    font-size: 13px; line-height: 1.7; color: #cbd5e1; white-space: pre-wrap;
    overflow-y: auto; flex: 1; background: #0b0f16; border-radius: 6px; padding: 8px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 600;
  }
  .chip.red  { background: #450a0a; color: #fca5a5; border: 1px solid #7f1d1d; }
  .chip.blue { background: #172554; color: #93c5fd; border: 1px solid #1e3a8a; }
  #sequence { margin-top: 10px; font-size: 13px; color: #fbbf24; }
  #mapwrap { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #camimg {
    width: 100%; border-radius: 6px; background: #000; aspect-ratio: 4/3; object-fit: cover;
  }
  #workstate {
    font-size: 18px; font-weight: 700; color: #4ade80; min-height: 28px;
    padding: 8px; background: #0b0f16; border-radius: 6px;
  }
  .bar { margin: 10px 0; }
  .bar .label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .bar .track { height: 10px; background: #0b0f16; border-radius: 5px; overflow: hidden; }
  .bar .fill { height: 100%; width: 0%; transition: width .4s; }
  #redfill { background: #ef4444; }
  #bluefill { background: #3b82f6; }
  #log {
    flex: 1; overflow-y: auto; font-size: 12px; line-height: 1.6;
    background: #0b0f16; border-radius: 6px; padding: 8px; color: #94a3b8;
  }
  #log div:last-child { color: #4ade80; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .stat {
    background: #0b0f16; border-radius: 6px; padding: 8px; text-align: center;
  }
  .stat .v { font-size: 22px; font-weight: 700; color: #f8fafc; }
  .stat .k { font-size: 11px; color: #64748b; margin-top: 2px; }
  footer {
    padding: 6px 20px; font-size: 12px; color: #475569;
    border-top: 1px solid #1f2b3d; background: #111827;
  }
</style>
</head>
<body>
<header>
  <h1>大模型技术创新赛 · 任务指挥面板</h1>
  <span id="conn">未连接</span>
  <span id="simtime">仿真时间: --</span>
</header>
<main>
  <div style="display:flex;flex-direction:column;gap:12px;min-height:0;">
    <div class="panel" style="flex:2;">
      <h2>出题 / 大模型解析</h2>
      <div id="question">等待出题程序发布题目…</div>
    </div>
    <div class="panel">
      <h2>结构化指令</h2>
      <div class="chips" id="chips"><span style="color:#475569;font-size:13px">--</span></div>
      <div id="sequence">顺序: --</div>
    </div>
    <div class="panel" style="flex:1;">
      <h2>识别画面 (RGBD)</h2>
      <img id="camimg" alt="camera">
    </div>
  </div>
  <div class="panel">
    <h2>SLAM 地图 / 机器人位姿 / 规划路径</h2>
    <div id="mapwrap"><canvas id="mapcv"></canvas></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px;min-height:0;">
    <div class="panel">
      <h2>当前工作状态</h2>
      <div id="workstate">待机</div>
      <div class="stats">
        <div class="stat"><div class="v" id="stt">--:--</div><div class="k">任务用时</div></div>
        <div class="stat"><div class="v" id="stg">0</div><div class="k">已抓取</div></div>
      </div>
    </div>
    <div class="panel">
      <h2>货物进度</h2>
      <div class="bar">
        <div class="label"><span>红色</span><span id="redtxt">0 / 0</span></div>
        <div class="track"><div class="fill" id="redfill"></div></div>
      </div>
      <div class="bar">
        <div class="label"><span>蓝色</span><span id="bluetxt">0 / 0</span></div>
        <div class="track"><div class="fill" id="bluefill"></div></div>
      </div>
    </div>
    <div class="panel" style="flex:1;">
      <h2>状态日志</h2>
      <div id="log"></div>
    </div>
  </div>
</main>
<footer>rosbridge: ws://192.168.30.131:9090 · 面板: http://192.168.30.131:8080/dashboard.html · 订阅 /mission/* /map /amcl_pose /plan</footer>

<script>
const VM = location.hostname || '192.168.30.131';
let ros = null, connected = false;
let mapData = null, robotPose = null, planPath = null;
let t0Task = null, grabbed = 0;

function logLine(s) {
  const el = document.getElementById('log');
  const d = document.createElement('div');
  const t = new Date().toLocaleTimeString('zh-CN', {hour12: false});
  d.textContent = `[${t}] ${s}`;
  el.appendChild(d);
  while (el.childElementCount > 200) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}

function connect() {
  ros = new ROSLIB.Ros({ url: `ws://${VM}:9090` });
  ros.on('connection', () => {
    connected = true;
    const c = document.getElementById('conn');
    c.textContent = '已连接 rosbridge'; c.classList.add('ok');
    logLine('rosbridge 已连接');
    subscribeAll();
  });
  ros.on('error', () => { document.getElementById('conn').textContent = '连接失败'; });
  ros.on('close', () => {
    connected = false;
    const c = document.getElementById('conn');
    c.textContent = '断开，重连中…'; c.classList.remove('ok');
    setTimeout(connect, 3000);
  });
}

let subs = [];
function mk(name, type, cb, rate) {
  const t = new ROSLIB.Topic({ ros, name, type, throttle_rate: rate || 0 });
  t.subscribe(cb);
  subs.push(t);
  return t;
}

function subscribeAll() {
  mk('/mission/question', 'std_msgs/String', m => {
    // llm_parser 收到题目后 /mission/task_info 会带出题目与解析
    document.getElementById('question').textContent = m.data;
    t0Task = Date.now();
    logLine('收到题目');
  });

  mk('/mission/task_info', 'std_msgs/String', m => {
    try {
      const d = JSON.parse(m.data);
      if (d.question) document.getElementById('question').textContent = d.question;
      const ch = document.getElementById('chips');
      ch.innerHTML = '';
      (d.items || []).forEach(it => {
        const s = document.createElement('span');
        s.className = 'chip ' + it.color;
        s.textContent = `${it.color === 'red' ? '红色' : '蓝色'}×${it.count} → ${it.zone}区`;
        ch.appendChild(s);
      });
      document.getElementById('sequence').textContent = '顺序: ' + (d.sequence || '--');
      logLine('解析: ' + (d.sequence || ''));
    } catch (e) { logLine('task_info 解析失败'); }
  });

  mk('/mission/work_state', 'std_msgs/String', m => {
    document.getElementById('workstate').textContent = m.data;
    logLine(m.data);
  }, 300);

  mk('/mission/progress', 'std_msgs/String', m => {
    logLine('进度: ' + m.data);
    const mt = m.data.match(/(红|蓝)色\s*(\d+)\s*\/\s*(\d+)/);
    if (mt) {
      const fill = mt[1] === '红' ? document.getElementById('redfill') : document.getElementById('bluefill');
      const txt = mt[1] === '红' ? document.getElementById('redtxt') : document.getElementById('bluetxt');
      fill.style.width = (100 * (+mt[2]) / Math.max(+mt[3], 1)) + '%';
      txt.textContent = `${mt[2]} / ${mt[3]}`;
      if (+mt[2] > grabbed) grabbed = +mt[2];
      document.getElementById('stg').textContent = grabbed;
    }
  }, 300);

  mk('/mission/red_required', 'std_msgs/Int32', m => {
    document.getElementById('redtxt').textContent =
      document.getElementById('redtxt').textContent.split('/')[0].trim() + ' / ' + m.data;
  });
  mk('/mission/blue_required', 'std_msgs/Int32', m => {
    document.getElementById('bluetxt').textContent =
      document.getElementById('bluetxt').textContent.split('/')[0].trim() + ' / ' + m.data;
  });

  mk('/map_volatile', 'nav_msgs/OccupancyGrid', m => { mapData = m; logLine('地图已加载'); }, 5000);
  mk('/amcl_pose', 'geometry_msgs/PoseWithCovarianceStamped', m => { robotPose = m; }, 200);
  mk('/plan', 'nav_msgs/Path', m => { planPath = m; }, 500);
  mk('/camera/image_raw', 'sensor_msgs/Image', drawCamera, 1500);
}

// ---------- 相机 ----------
const camCtx = document.getElementById('camimg');
function drawCamera(m) {
  try {
    const w = m.width, h = m.height;
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const cx = cv.getContext('2d');
    const img = cx.createImageData(w, h);
    let d;
    if (typeof m.data === 'string') {  // base64
      const bin = atob(m.data);
      d = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) d[i] = bin.charCodeAt(i);
    } else d = m.data;
    const step = m.step || w * 3;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const si = y * step + x * 3, di = (y * w + x) * 4;
        img.data[di] = d[si]; img.data[di + 1] = d[si + 1];
        img.data[di + 2] = d[si + 2]; img.data[di + 3] = 255;
      }
    }
    cx.putImageData(img, 0, 0);
    camimg.src = cv.toDataURL('image/jpeg', 0.7);
  } catch (e) { /* 帧数据异常忽略 */ }
}

// ---------- 地图渲染 ----------
const cv = document.getElementById('mapcv');
const ctx = cv.getContext('2d');
function worldToPx(x, y) {
  const i = mapData.info;
  const ox = i.origin.position.x, oy = i.origin.position.y;
  return [ (x - ox) / i.resolution, i.height - (y - oy) / i.resolution ];
}
function draw() {
  const wrap = cv.parentElement;
  if (cv.width !== wrap.clientWidth || cv.height !== wrap.clientHeight) {
    cv.width = wrap.clientWidth; cv.height = wrap.clientHeight;
  }
  ctx.fillStyle = '#0b0f16';
  ctx.fillRect(0, 0, cv.width, cv.height);
  if (mapData) {
    const i = mapData.info;
    const sc = Math.min(cv.width / i.width, cv.height / i.height) * 0.96;
    const offx = (cv.width - i.width * sc) / 2;
    const offy = (cv.height - i.height * sc) / 2;
    if (!mapData._cv) {
      const oc = document.createElement('canvas');
      oc.width = i.width; oc.height = i.height;
      const ox = oc.getContext('2d');
      const idata = ox.createImageData(i.width, i.height);
      for (let n = 0; n < i.width * i.height; n++) {
        const v = mapData.data[n];
        let rr = 11, gg = 15, bb = 22;
        if (v === 0) { rr = 28; gg = 37; bb = 50; }
        else if (v > 65) { rr = 143; gg = 163; bb = 191; }
        const di = n * 4;
        idata.data[di] = rr; idata.data[di + 1] = gg;
        idata.data[di + 2] = bb; idata.data[di + 3] = 255;
      }
      ox.putImageData(idata, 0, 0);
      mapData._cv = oc;
    }
    ctx.save();
    ctx.translate(offx, offy);
    ctx.scale(sc, sc);
    ctx.translate(0, i.height);
    ctx.scale(1, -1);
    ctx.drawImage(mapData._cv, 0, 0);
    ctx.restore();

    const tf = (x, y) => {
      const p = worldToPx(x, y);
      return [offx + p[0] * sc, offy + (i.height - p[1]) * sc];
    };

    // 规划路径
    if (planPath && planPath.poses.length) {
      ctx.strokeStyle = '#22d3ee'; ctx.lineWidth = 2; ctx.beginPath();
      planPath.poses.forEach((ps, idx) => {
        const [px, py] = tf(ps.pose.position.x, ps.pose.position.y);
        idx ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      });
      ctx.stroke();
    }

    // 机器人
    if (robotPose) {
      const p = robotPose.pose.pose.position;
      const o = robotPose.pose.pose.orientation;
      const yaw = Math.atan2(2 * (o.w * o.z + o.x * o.y), 1 - 2 * (o.y * o.y + o.z * o.z));
      const [px, py] = tf(p.x, p.y);
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(-yaw);
      ctx.fillStyle = '#4ade80';
      ctx.beginPath();
      ctx.moveTo(10, 0); ctx.lineTo(-6, 6); ctx.lineTo(-6, -6); ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#052e16'; ctx.stroke();
      ctx.restore();
    }
  } else {
    ctx.fillStyle = '#334155';
    ctx.font = '16px sans-serif';
    ctx.fillText('等待 /map …', 30, 40);
  }
  // 计时
  if (t0Task) {
    const s = Math.floor((Date.now() - t0Task) / 1000);
    document.getElementById('stt').textContent =
      `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  }
  }
setInterval(draw, 200);
connect();
</script>
</body>
</html>
